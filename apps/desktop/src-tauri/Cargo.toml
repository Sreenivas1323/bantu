[package]
name = "bantu-desktop"
description = "Bantu desktop shell: starts bantud and shows its web UI"
version = "0.1.0-alpha.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sreenivas1323/bantu"

[[bin]]
name = "bantu-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
