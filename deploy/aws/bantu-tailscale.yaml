AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Bantu on your own AWS account: a small Graviton EC2 machine running bantud,
  reachable only over your Tailscale network (no open ports), that stops itself
  when idle and wakes from a private link. https://github.com/Sreenivas1323/bantu

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Access }
        Parameters: [TailscaleAuthKey, MachineName]
      - Label: { default: Machine }
        Parameters: [InstanceType, DiskGiB, IdleStopMinutes, BantuVersion]

Parameters:
  TailscaleAuthKey:
    Type: String
    NoEcho: true
    MinLength: 10
    Description: >-
      A Tailscale auth key (admin console → Settings → Keys). Make it reusable
      if you may recreate the stack. Only used on first boot.
  MachineName:
    Type: String
    Default: bantu
    AllowedPattern: "^[a-z0-9-]{1,40}$"
    Description: Tailscale machine name; the app will be at https://<name>.<your-tailnet>.ts.net
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues: [t4g.small, t4g.medium, t4g.large, t4g.xlarge]
    Description: t4g.medium (2 vCPU, 4 GB) suits 2-4 parallel agents. You pay only while it runs.
  DiskGiB:
    Type: Number
    Default: 30
    MinValue: 16
    MaxValue: 500
    Description: Encrypted gp3 disk for repos and worktrees (~$0.08 per GiB-month, also while stopped).
  IdleStopMinutes:
    Type: Number
    Default: 60
    MinValue: 0
    Description: Stop the machine after this many idle minutes (no agent working, no terminal or browser connected). 0 = never.
  BantuVersion:
    Type: String
    Default: latest
    Description: Bantu release tag to install, e.g. v0.1.0-alpha.2.

Resources:
  # --- Network: a private-by-default VPC with internet egress only ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bantu - no inbound access; Tailscale connects outbound
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }

  # --- Machine ------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # Session Manager gives you a shell (for `claude login`) without SSH.
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      # `shutdown` from the idle timer stops (not terminates) the machine.
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: !Ref DiskGiB, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/bantu-setup.log) 2>&1
          U=ec2-user
          H=/home/$U

          dnf install -y git tmux jq
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

          # Tailscale: private HTTPS name, no inbound ports.
          curl -fsSL https://tailscale.com/install.sh | sh
          systemctl enable --now tailscaled
          tailscale up --authkey='${TailscaleAuthKey}' --hostname='${MachineName}'
          tailscale serve --bg 47800
          # Previews need a port of their own, so pages can't reach the daemon's token.
          tailscale serve --bg --https=8443 47801
          DNS=$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')

          # Claude Code and Bantu for the regular user.
          sudo -u $U bash -lc 'curl -fsSL https://claude.ai/install.sh | bash'
          sudo -u $U env BANTU_VERSION='${BantuVersion}' BANTU_NO_SERVICE=1 \
            bash -lc 'curl -fsSL https://raw.githubusercontent.com/Sreenivas1323/bantu/main/deploy/install.sh | sh'

          cat > /etc/systemd/system/bantud.service <<UNIT
          [Unit]
          Description=Bantu daemon
          After=network-online.target tailscaled.service
          [Service]
          User=$U
          Environment=HOME=$H
          Environment=PATH=$H/.local/bin:/usr/local/bin:/usr/bin:/bin
          Environment=BANTU_PUBLIC_URL=https://$DNS
          Environment=BANTU_PREVIEW_URL=https://$DNS:8443
          ExecStart=$H/.local/bin/bantud
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          UNIT
          # So `bantud url --qr` in a shell prints the public address.
          echo "export BANTU_PUBLIC_URL=https://$DNS" > /etc/profile.d/bantu.sh

          # Idle auto-stop: nothing running, nothing connected, nobody logged in.
          cat > /usr/local/bin/bantu-idle-stop <<'SCRIPT'
          #!/bin/bash
          limit_min=${IdleStopMinutes}
          [ "$limit_min" -gt 0 ] || exit 0
          # Give a fresh boot time to settle.
          [ "$(cut -d. -f1 /proc/uptime)" -gt 900 ] || exit 0
          [ "$(who | wc -l)" -eq 0 ] || exit 0
          token=$(cat /home/ec2-user/.bantu/local-token 2>/dev/null) || exit 0
          a=$(curl -fs -H "Authorization: Bearer $token" http://127.0.0.1:47800/v1/activity) || exit 0
          [ "$(echo "$a" | jq -r .busy)" = false ] || exit 0
          [ "$(echo "$a" | jq -r .idle_seconds)" -ge $((limit_min * 60)) ] || exit 0
          logger -t bantu "idle for ${IdleStopMinutes}+ minutes; stopping the machine"
          shutdown -h now
          SCRIPT
          chmod 755 /usr/local/bin/bantu-idle-stop
          cat > /etc/systemd/system/bantu-idle-stop.service <<'UNIT'
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/bantu-idle-stop
          UNIT
          cat > /etc/systemd/system/bantu-idle-stop.timer <<'UNIT'
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=5min
          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now bantud.service bantu-idle-stop.timer
          echo "Bantu is ready at https://$DNS"

  # --- Wake link: a private URL that starts the machine -------------------
  WakeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: start-bantu-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:StartInstances]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
              - Effect: Allow
                Action: [ec2:DescribeInstances]
                Resource: "*"
  WakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt WakeRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref Instance
          # The stack's UUID doubles as the link's secret.
          WAKE_KEY: !Select [2, !Split ["/", !Ref AWS::StackId]]
          MACHINE: !Ref MachineName
      Code:
        ZipFile: |
          import hmac, html, os
          import boto3

          ec2 = boto3.client("ec2")

          def page(status, body):
              return {"statusCode": status, "headers": {"content-type": "text/html; charset=utf-8"},
                      "body": "<!doctype html><meta name=viewport content='width=device-width'>"
                              "<body style='font:16px system-ui;background:#111;color:#eee;padding:2rem'>"
                              + body}

          def handler(event, _context):
              key = (event.get("queryStringParameters") or {}).get("key", "")
              if not hmac.compare_digest(key, os.environ["WAKE_KEY"]):
                  return page(403, "Not allowed.")
              iid = os.environ["INSTANCE_ID"]
              state = ec2.describe_instances(InstanceIds=[iid])["Reservations"][0]["Instances"][0]["State"]["Name"]
              if state == "stopped":
                  ec2.start_instances(InstanceIds=[iid])
                  msg = "Starting your Bantu machine. It's usually ready in about a minute."
              elif state == "running":
                  msg = "Your Bantu machine is already running."
              else:
                  msg = f"Your Bantu machine is {html.escape(state)}; try again shortly."
              name = html.escape(os.environ["MACHINE"])
              return page(200, f"<h1>Bantu</h1><p>{msg}</p><p>Then open <b>https://{name}.&lt;your-tailnet&gt;.ts.net</b>.</p>")
  WakeUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt WakeFunction.Arn
  WakeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref WakeFunction
      Principal: "*"
      FunctionUrlAuthType: NONE
  # Newer accounts also require InvokeFunction for public function URLs. The
  # function checks the key itself, so direct invokes can't do anything.
  WakeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WakeFunction
      Principal: "*"

Outputs:
  OpenBantu:
    Description: Open this from any device on your tailnet (setup takes ~3 minutes after the stack completes).
    Value: !Sub "https://${MachineName}.<your-tailnet>.ts.net"
  WakeLink:
    Description: Bookmark this private link to start the machine after it idles out.
    Value: !Sub
      - "${Url}?key=${Key}"
      - Url: !GetAtt WakeUrl.FunctionUrl
        Key: !Select [2, !Split ["/", !Ref AWS::StackId]]
  Shell:
    Description: Open a shell on the machine (then run `claude login` once, and `bantud url --qr` to pair a phone).
    Value: !Sub "aws ssm start-session --region ${AWS::Region} --target ${Instance}"
  InstanceId:
    Value: !Ref Instance
