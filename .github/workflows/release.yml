name: Release

# Push a tag like v0.1.0 to publish a GitHub release with prebuilt binaries.
# Manual runs build everything and keep the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist

  build:
    name: bantud (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Debian 11 containers keep the glibc requirement at 2.31, so the
          # binaries also run on Amazon Linux 2023, Ubuntu 20.04, etc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, container: "rust:1-bullseye" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "rust:1-bullseye" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p bantud --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - name: Package
        shell: bash
        run: |
          name=bantu-${{ matrix.target }}
          mkdir -p "$name/bin" "$name/share/bantu"
          cp target/${{ matrix.target }}/release/bantud "$name/bin/"
          cp -R web "$name/share/bantu/web"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: bantu-${{ matrix.target }}
          path: bantu-${{ matrix.target }}.tar.gz

  desktop:
    name: Desktop app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo version $version"; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          workspaces: |
            .
            apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: scripts/prepare-desktop.sh ${{ matrix.target }}
      # Sign with the Developer ID and notarize when the secrets exist
      # (see docs/RELEASING.md); otherwise Tauri ad-hoc signs the app.
      - name: Signing setup
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Developer ID secrets; building an ad-hoc signed app."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "KEYCHAIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            echo "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          fi
      - run: bun x tauri build --target ${{ matrix.target }} --bundles app,dmg
        working-directory: apps/desktop
      - name: Collect
        run: |
          arch=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo apple-silicon || echo intel)
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "Bantu-macOS-$arch.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: bantu-desktop-${{ matrix.target }}
          path: Bantu-macOS-*.dmg

  publish:
    name: Publish
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bantu-*
          merge-multiple: true
      - run: ls -la
      - name: Checksums
        run: sha256sum bantu-*.tar.gz Bantu-macOS-*.dmg > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.1.0-alpha.1) are marked as pre-releases.
          pre=""; case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" bantu-*.tar.gz Bantu-macOS-*.dmg SHA256SUMS $pre \
            --repo "${GITHUB_REPOSITORY}" --title "Bantu ${GITHUB_REF_NAME}" --generate-notes
      # Launch Stack links need the templates in a public bucket (docs/RELEASING.md).
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_TEMPLATE_BUCKET != ''
        with:
          role-to-assume: ${{ secrets.AWS_TEMPLATE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEMPLATE_REGION || 'us-east-1' }}
      - name: Publish CloudFormation templates
        if: vars.AWS_TEMPLATE_BUCKET != ''
        run: aws s3 cp deploy/aws/ "s3://${{ vars.AWS_TEMPLATE_BUCKET }}/" --recursive --exclude '*' --include '*.yaml'
