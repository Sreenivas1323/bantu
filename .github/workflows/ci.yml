name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.name "Bantu CI"
          git config --global user.email "ci@bantu.invalid"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- packages/protocol || {
            echo "::error::Run 'cargo test -p bantu-protocol' and commit packages/protocol/src/generated";
            exit 1;
          }

  # Windows is a preview, so this reports without blocking anyone yet. The API
  # tests drive shell-script fake agents, so only unit tests run here.
  windows:
    name: Rust (windows-latest, preview)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.name "Bantu CI"
          git config --global user.email "ci@bantu.invalid"
          git config --global init.defaultBranch main
      - run: cargo build -p bantud
      - run: cargo test --workspace --lib --bins

  burst-runner:
    name: Burst runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/vercel-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Configure git for tests
        run: |
          git config --global user.name "Bantu CI"
          git config --global user.email "ci@bantu.invalid"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:web
