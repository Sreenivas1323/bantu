[package]
name = "bantud"
description = "The Bantu daemon: runs coding agents in git worktrees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bantu-git = { version = "0.1.0-alpha.3", path = "../git" }
bantu-protocol = { version = "0.1.0-alpha.3", path = "../protocol" }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.2"
globset = "0.4.21"
hex = "0.4.3"
hmac = "0.13"
libc = "0.2.191"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tempfile = "3.27.0"
