[package]
name = "bantu-git"
description = "Thin async wrapper around the git CLI used by Bantu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "fs", "macros", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
